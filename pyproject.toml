[project]
name = "contacompa"
version = "0.1.0"
description = "Turns business PDFs into validated structured data, with measured accuracy and cost per document."
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.104",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "langsmith>=0.14.0",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.104",
    "faker>=40.39.0",
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.8",
    "testcontainers[postgres]>=4.15.0",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
target-version = "py313"
# Tool caches live inside .venv so the repository root stays clean.
cache-dir = ".venv/.cache/ruff"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
strict = true
cache_dir = ".venv/.cache/mypy"
python_version = "3.13"
files = ["src", "tests"]
# migrations are frozen history, checked by the migration test rather than by types
exclude = ["src/contacompa/infrastructure/db/migrations/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".venv/.cache/pytest"
addopts = ["-m", "not integration"]
markers = [
    "integration: needs PostgreSQL (docker compose up db)",
]
filterwarnings = [
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
    # testcontainers 4.15 points at testcontainers.community.postgres; brief asks
    # for testcontainers.postgres.PostgresContainer explicitly.
    "ignore:testcontainers.postgres is deprecated:DeprecationWarning",
]

[[tool.mypy.overrides]]
module = "contacompa.infrastructure.parsing.pymupdf"
disallow_untyped_calls = false
